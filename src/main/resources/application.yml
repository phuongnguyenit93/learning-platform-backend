spring:
  application:
    name: learning-platform-backend
  session:
    timeout: 30d
    jdbc:
      # Oracle schema is managed manually by sql/22_authentication.sql.
      initialize-schema: never

server:
  port: ${PORT:8080}
  shutdown: graceful
  # Required for HTTPS OAuth redirect URIs behind Nginx on Oracle A1.
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 30d
      cookie:
        name: SESSION
        http-only: true
        secure: true
        same-site: lax

app:
  auth:
    google:
      enabled: ${GOOGLE_AUTH_ENABLED:false}
    frontend-url: ${AUTH_FRONTEND_URL:https://nguyendodinhphuong.name.vn}

# Keep the Oracle-backed catalog opt-in; without this profile, the app
# starts without a database connection and exposes no catalog endpoints.
---
spring:
  config:
    activate:
      on-profile: "!oracle"
  autoconfigure:
    exclude: org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration

---
spring:
  config:
    activate:
      on-profile: oracle
    # Compose grants read-only files under /run/secrets/. Each filename
    # (spring.datasource.url, .username, .password) becomes a Spring property.
    # Optional keeps local H2 tests working without production secrets.
    import: optional:configtree:/run/secrets/
  datasource:
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 0
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
